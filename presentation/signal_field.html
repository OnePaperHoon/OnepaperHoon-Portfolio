*{box-sizing:border-box;margin:0}.slide-container{width:1280px;min-height:720px;display:grid;grid-template-columns:7fr 5fr;background:#111111;color:#ffffff;font-family:Arial,Helvetica,sans-serif}.left{min-height:720px;padding-top:46px;padding-left:54px;padding-right:42px;display:flex;flex-direction:column}.right{min-height:720px;background:#ffffff;color:#111111;padding-top:46px;padding-left:36px;padding-right:36px;display:flex;flex-direction:column;border-left:2px solid #FF3300}.top{display:flex;justify-content:space-between;border-top:2px solid #FF3300;padding-top:12px;color:#FF3300;font-size:15px;font-weight:900;letter-spacing:1px}.title{max-width:690px;margin-top:78px;font-size:76px;font-weight:900;letter-spacing:-5.5px;line-height:.88}.title span{color:#FF3300}.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:auto;margin-bottom:48px}.principle{border-top:2px solid rgba(255,255,255,.35);padding-top:14px}.principle b{display:block;color:#FF3300;font-size:14px;letter-spacing:.8px;margin-bottom:10px}.principle p{max-width:170px;color:#c4c4c4;font-size:15px;line-height:1.42}.serial{color:#FF3300;font-size:15px;font-weight:900;letter-spacing:1px}.swatches{display:grid;gap:0;margin-top:48px;border-top:2px solid #111}.swatch{display:grid;grid-template-columns:92px 1fr;align-items:center;min-height:112px;border-bottom:2px solid #111}.bar-black{width:72px;min-height:72px;background:#111}.bar-red{width:72px;min-height:72px;background:#FF3300}.bar-white{width:72px;min-height:72px;border:2px solid #111;background:#fff}.swatch h2{font-size:23px;letter-spacing:-1px}.swatch p{margin-top:6px;color:#555;font-size:14px;line-height:1.35}.right-note{margin-top:auto;margin-bottom:46px;font-size:32px;font-weight:300;line-height:1.02;letter-spacing:-1.8px}.right-note b{font-weight:900;color:#FF3300}.signal{position:relative;width:100%;min-height:82px;border-top:2px solid #111;border-bottom:2px solid #111}.signal::before{content:"";position:absolute;left:3 </head><body><div class="slide-container"><section class="left"><div class="top"><span>02 / SIGNAL FIELD</span><span>VISUAL SYSTEM</span></div><h1 class="title">검은 무대 위의<br><span>명료한 신호.</span></h1><div class="principles"><div class="principle"><b>INK BLACK</b><p>작업과 모션이 가장 또렷하게 읽히는 기본 캔버스.</p></div><div class="principle"><b>SIGNAL LIME</b><p>행동, 상태, 방향을 가리키는 유일한 강조색.</p></div><div class="principle"><b>THIN FRAMES</b><p>콘텐츠를 가두지 않고 위치와 관계를 드러내는 구조.</p></div></div></section><section class="right"><div class="serial">SYSTEM / 03</div><div class="swatches"><div class="swatch"><span class="bar-black"></span><div><h2>Ink Black</h2><p>기본 인상과 공간의 깊이</p></div></div><div class="swatch"><span class="bar-red"></span><div><h2>Signal Accent</h2><p>행동·상태·방향의 표시</p></div></div><div class="swatch"><span class="bar-white"></span><div><h2>White Space</h2><p>읽기와 비교를 위한 여백</p></div></div></div><p class="right-note">색은 장식이 아니라<br><b>행동의 문법</b>이다.</p><div class="signal"></div></section></div></body></html>
