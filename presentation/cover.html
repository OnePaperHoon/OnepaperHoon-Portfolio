<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; display: grid; grid-template-columns: 7fr 5fr; background: #111111; color: #ffffff; font-family: Arial, Helvetica, sans-serif; }
    /* keep top padding (48px) as required, shrink inner horizontal padding and gaps */
    .dark-side { min-height: 720px; display: flex; flex-direction: column; padding-top: 48px; padding-left: 32px; padding-right: 32px; border-right: 2px solid #FF3300; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; letter-spacing: -.5px; }
    .mark { width: 18px; min-height: 25px; border-left: 4px solid #FF3300; border-right: 4px solid #FF3300; position: relative; }
    .mark::after { content: ""; position: absolute; left: 4px; top: 5px; width: 4px; min-height: 16px; background: #FF3300; }
    /* refresh layout: reduce vertical gaps by using a wrapper and tighter margins */
    .cover-wrap { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; margin-bottom: 12px; }
    .cover-title { max-width: 640px; font-size: 100px; font-weight: 900; line-height: .84; letter-spacing: -7px; margin: 0; }
    .cover-title span { color: #FF3300; }
    .meta { display: flex; justify-content: space-between; margin-top: auto; border-top: 2px solid rgba(255,255,255,.35); padding-top: 12px; color: #bcbcbc; font-size: 15px; font-weight: 700; letter-spacing: .4px; margin-bottom: 12px; }
    .light-side { min-height: 720px; display: flex; flex-direction: column; padding-top: 48px; padding-left: 24px; padding-right: 24px; background: #ffffff; color: #111111; }
    .serial { color: #FF3300; font-size: 16px; font-weight: 900; letter-spacing: 1px; }
    .side-wrap { display:flex; flex-direction: column; gap: 8px; margin-top: 24px; margin-bottom: 12px; }
    .side-copy { max-width: 340px; font-size: 31px; font-weight: 300; line-height: 1.12; letter-spacing: -1.5px; margin: 0; }
    .anchor { margin-top: auto; color: #FF3300; font-size: 164px; font-weight: 900; line-height: .62; letter-spacing: -12px; text-align: right; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="dark-side">
      <div class="brand"><span class="mark"></span><span>onepaperhoon</span></div>
      <div class="cover-wrap">
        <h1 class="cover-title">Signal<br>Field<span>.</span></h1>
      </div>
      <div class="meta"><span>PORTFOLIO EXPERIENCE DESIGN</span><span>2026</span></div>
    </section>
    <section class="light-side">
      <div class="serial">01 / 11</div>
      <div class="side-wrap">
        <p class="side-copy">모션으로 읽히는<br>개인 포트폴리오<br>경험 설계.</p>
      </div>
      <div class="anchor">.</div>
    </section>
  </div>
</body>
</html>
