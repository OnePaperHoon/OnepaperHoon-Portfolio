<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; display: grid; grid-template-columns: 35% 65%; background: #ffffff; color: #111111; font-family: Arial, Helvetica, sans-serif; }
    .intro { min-height: 720px; display: flex; flex-direction: column; padding-top: 46px; padding-left: 48px; padding-right: 38px; background: #111111; color: #ffffff; }
    .index { color: #FF3300; font-size: 15px; font-weight: 900; letter-spacing: 1px; }
    .intro h1 { margin-top: auto; margin-bottom: 72px; font-size: 62px; font-weight: 900; line-height: .86; letter-spacing: -4px; }
    .intro h1 span { color: #FF3300; }
    .intro-note { margin-bottom: 34px; border-top: 2px solid rgba(255,255,255,.38); padding-top: 14px; color: #b9b9b9; font-size: 14px; font-weight: 700; line-height: 1.35; }
    .steps { min-height: 720px; display: grid; grid-template-rows: repeat(3, 1fr); border-left: 2px solid #FF3300; }
    .step { display: grid; grid-template-columns: 118px 1fr 162px; align-items: center; gap: 24px; padding-top: 25px; padding-left: 34px; padding-right: 38px; border-bottom: 2px solid #111111; }
    .step:last-child { border-bottom: 0; }
    .step-number { color: #FF3300; font-size: 72px; font-weight: 900; line-height: .8; letter-spacing: -5px; }
    .step-main h2 { font-size: 34px; font-weight: 900; line-height: .95; letter-spacing: -2px; }
    .step-main p { max-width: 395px; margin-top: 15px; color: #555555; font-size: 16px; line-height: 1.42; }
    .step-label { align-self: stretch; display: flex; align-items: flex-start; justify-content: flex-end; padding-top: 6px; color: #FF3300; font-size: 13px; font-weight: 900; letter-spacing: .9px; text-align: right; }
    .step-label span { max-width: 120px; }
    .footer-line { position: absolute; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="intro">
      <div class="index">06 / PROCESS</div>
      <h1>세 번의<br><span>판단</span>을<br>드러낸다.</h1>
      <p class="intro-note">상세 사례는 산출물의 순서가 아니라,<br>생각이 바뀐 순서로 설계한다.</p>
    </section>
    <section class="steps">
      <article class="step">
        <div class="step-number">01</div>
        <div class="step-main"><h2>관찰</h2><p>사용자가 흐름을 잃는 지점과 기존 경험의 맥락을 정확히 찾는다.</p></div>
        <div class="step-label"><span>OBSERVATION</span></div>
      </article>
      <article class="step">
        <div class="step-number">02</div>
        <div class="step-main"><h2>실험</h2><p>여러 인터랙션 모델을 비교하고, 설명만 늘리는 반응은 과감히 제거한다.</p></div>
        <div class="step-label"><span>EXPERIMENT</span></div>
      </article>
      <article class="step">
        <div class="step-number">03</div>
        <div class="step-main"><h2>결정</h2><p>남은 규칙을 시스템화해 화면과 기기 사이에서 일관되게 작동하게 한다.</p></div>
        <div class="step-label"><span>DECISION</span></div>
      </article>
    </section>
  </div>
</body>
</html>
