</head><body><div class="slide-container"><div class="top"><span>01 / PURPOSE</span><span>onepaperhoon.com</span></div><h1 class="statement">작업을 나열하지 않고,<br><span>관점을 경험시킨다.</span></h1><div class="rule"></div><div class="columns"><article class="col"><span class="num">01</span><h2>독립 디지털<br>프랙티스의 무대</h2><p>카드 모음이 아니라, 작업 세계에 진입하는 첫 장면을 만든다.</p></article><article class="col"><span class="num">02</span><h2>미감과 제작 역량을<br>동시에 전달</h2><p>첫 화면의 시각 언어와 반응 방식이 제작의 수준을 직접 보여 준다.</p></article><article class="col"><span class="num">03</span><h2>결과보다 판단을<br>먼저 보여 줌</h2><p>상세 사례는 문제·관점·과정을 거쳐 결과물로 도착한다.</p></article></div><p class="footer">A portfolio should make the work feel inevitable, not merely visible.</p></div></body></html>
