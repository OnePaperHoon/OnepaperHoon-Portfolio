<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OnePaperHoon — Archive 2026</title>
<meta name="description" content="A personal photo archive. Sokcho in August and Kyoto in September, 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#000; --ink:#f4f2ef; --dim:#8c8783; --line:rgba(244,242,239,.28);
  --pad:clamp(14px, 2.6vw, 34px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --hw:min(56vw, 640px);
  --persp:1150px;
  --safe-top:env(safe-area-inset-top, 0px); --safe-right:env(safe-area-inset-right, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px); --safe-left:env(safe-area-inset-left, 0px);
  --tap:44px;
  --serif:"Playfair Display", "Times New Roman", serif;
  --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --cw:200px;
}
*,*::before,*::after{box-sizing:border-box; margin:0; padding:0}
html{background:#000; scrollbar-width:none; -ms-overflow-style:none}
html::-webkit-scrollbar, #grid::-webkit-scrollbar, #lit::-webkit-scrollbar{display:none}
#grid, #lit{scrollbar-width:none; -ms-overflow-style:none}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:300;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden; min-height:100vh; min-height:100dvh; overscroll-behavior-y:none;
}
body.locked{overflow:hidden; height:100vh; height:100dvh}
img{display:block; max-width:100%}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
a{-webkit-tap-highlight-color:transparent}
em{font-style:normal}

#scrolltrack{height:170vh; pointer-events:none}

/* ---------- 3D archive ---------- */
#stage{
  position:fixed; inset:0; z-index:10; perspective:var(--persp); perspective-origin:50% 50%;
  overflow:hidden; touch-action:none;
  transition:opacity .6s var(--ease), filter .6s var(--ease);
}
@media (pointer:coarse){ #stage{touch-action:pan-y} }
#world{
  position:absolute; top:50%; left:50%;
  width:0; height:0;
  transform-style:preserve-3d;
  will-change:transform;
}
#orb{
  position:absolute; top:0; left:0;
  width:0; height:0;
  transform-style:preserve-3d;
  opacity:1;
  transform:none;
}
#headline{
  position:absolute; top:0; left:0;
  width:var(--hw);
  margin-left:calc(var(--hw) / -2);
  text-align:center;
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(25px, 3.7vw, 55px);
  line-height:1.06;
  letter-spacing:-.005em;
  color:#fff;
  text-shadow:0 2px 34px rgba(0,0,0,.55);
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}
#headline .inner{
  position:absolute; top:0; left:0;
  width:100%;
  transform:translateY(-50%);
}
#headline .inner span{
  display:inline-block; opacity:0; transform:translateY(.42em); filter:blur(7px);
}
body.revealed #headline .inner span{
  opacity:1; transform:none; filter:blur(0);
  transition:opacity 1.05s var(--ease), transform 1.15s var(--ease), filter 1.05s var(--ease);
  transition-delay:calc(.9s + var(--i) * .085s);
}
.card{
  position:absolute; top:0; left:0;
  width:var(--cw); height:calc(var(--cw) * 1.25);
  margin-left:calc(var(--cw) / -2); margin-top:calc(var(--cw) * -.625);
  cursor:pointer; backface-visibility:visible;
}
.card figure{
  position:absolute; inset:0; overflow:hidden; border-radius:3px; background:#0a0a0a;
  transition:transform .5s ease;
}
.card:hover figure{transform:scale(1.045)}
.card img{width:100%; height:100%; object-fit:cover; opacity:0; -webkit-user-drag:none; user-select:none}
.card img.in{opacity:1}
body.revealed .card img{transition:opacity .8s ease-out}
.card figure::after{
  content:""; position:absolute; inset:0; background:rgba(0,0,0,var(--d,0));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); border-radius:3px; pointer-events:none;
}
body.gridview #stage{opacity:0; filter:blur(14px); pointer-events:none}
body.switching #stage, body.switching .bio, body.switching .colophon{opacity:0; transition:opacity .45s var(--ease)}
#menu nav a.current{opacity:1}

.vig{
  position:fixed; inset:0; z-index:12; pointer-events:none;
  background:radial-gradient(ellipse 88% 92% at 50% 50%, transparent 48%, rgba(0,0,0,.26) 80%, rgba(0,0,0,.72) 100%);
  transition:opacity .6s var(--ease);
}
body.gridview .vig, body.lit .vig{opacity:0}

/* ---------- chrome ---------- */
.chrome{opacity:0}
body.revealed .chrome{opacity:1; transition:opacity 1.2s var(--ease) .15s, transform .5s var(--ease)}
header{
  position:fixed; top:0; left:0; width:100%; z-index:60;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:calc(var(--pad) * .8 + var(--safe-top)) calc(var(--pad) + var(--safe-right)) calc(var(--pad) * .35) calc(var(--pad) + var(--safe-left));
  mix-blend-mode:difference;
}
.wordmark{
  font-family:var(--serif); font-size:clamp(19px, 2.1vw, 27px); letter-spacing:.005em; line-height:1;
  color:#fff; text-decoration:none; white-space:nowrap;
}
.menu-btn{display:flex; flex-direction:column; align-items:flex-end; gap:5px; min-width:44px; min-height:44px; padding:8px 0 4px}
.menu-label{font-size:clamp(12px, 1.25vw, 15px); letter-spacing:.01em; color:#fff; transition:opacity .35s}
.bars{position:relative; display:block; width:clamp(42px, 4.4vw, 62px); height:clamp(16px, 2vw, 22px)}
.bars i{
  position:absolute; left:0; right:0; top:50%; height:1px; background:#fff;
  transform:translateY(-5px); transition:transform .45s var(--ease), width .45s var(--ease);
}
.bars i + i{left:auto; width:clamp(34px, 3.6vw, 50px); transform:translateY(5px)}
.menu-btn:hover .bars i + i{transform:translate(-8px, 5px)}
body.menuopen header{z-index:90; mix-blend-mode:normal}
body.menuopen .wordmark{color:#f4f2ef}
body.menuopen .menu-label{opacity:0}
body.menuopen .bars i{width:100%; left:0; background:#f4f2ef; transform:translateY(0) rotate(45deg)}
body.menuopen .bars i + i{transform:translateY(0) rotate(-45deg)}

.bio{
  position:fixed; left:calc(var(--pad) + var(--safe-left)); bottom:calc(var(--pad) + var(--safe-bottom));
  z-index:55; max-width:min(320px, 46vw);
}
.bio .who{display:flex; align-items:center; gap:14px; margin-bottom:14px}
#avatar{width:52px; height:52px; border-radius:3px; object-fit:cover; filter:grayscale(.15)}
.bio b{font-family:var(--serif); font-weight:400; font-size:19px; letter-spacing:.01em}
.bio p{font-size:12.5px; line-height:1.62; color:rgba(244,242,239,.72)}
body.deep .bio, body.gridview .bio, body.lit .bio{opacity:0; transform:translateY(10px); pointer-events:none}

.colophon{
  position:fixed; right:calc(var(--pad) + var(--safe-right)); bottom:calc(var(--pad) + var(--safe-bottom));
  z-index:55; font-size:12.5px; color:rgba(244,242,239,.72);
}
body.gridview .colophon, body.lit .colophon{opacity:0}

.gridbtn{
  position:fixed; left:calc(var(--pad) + var(--safe-left)); bottom:calc(var(--pad) + var(--safe-bottom));
  z-index:56; width:44px; height:44px; padding:5px;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:4px;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .5s var(--ease), transform .5s var(--ease);
}
.gridbtn b{background:#f4f2ef; border-radius:2px; transition:transform .35s var(--ease), background .35s}
body.deep .gridbtn, body.gridview .gridbtn{opacity:1; transform:none; pointer-events:auto}
body.lit .gridbtn{opacity:0; pointer-events:none}
.gridbtn:hover b{background:#fff; transform:scale(.86)}
body.gridview .gridbtn b:first-child{transform:translate(3px, 3px)}
body.gridview .gridbtn b:last-child{transform:translate(-3px, -3px)}

.cue{
  position:fixed; left:50%; bottom:calc(var(--pad) + var(--safe-bottom) + 4px); transform:translateX(-50%);
  z-index:54; display:flex; align-items:center; gap:10px;
  font-size:10px; text-transform:uppercase; letter-spacing:.24em; color:rgba(244,242,239,.42); white-space:nowrap;
}
.cue s{display:block; width:44px; height:1px; background:rgba(244,242,239,.28); overflow:hidden; text-decoration:none; position:relative}
.cue s::after{content:""; position:absolute; inset:0; background:#f4f2ef; animation:sweep 2.6s ease infinite}
@keyframes sweep{0%{transform:translateX(-100%)} 55%{transform:translateX(0)} 100%{transform:translateX(100%)}}
body.deep .cue, body.gridview .cue, body.lit .cue{opacity:0}

/* ---------- flat grid ---------- */
#grid{
  position:fixed; inset:0; z-index:20; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:calc(var(--pad) * 3.4) var(--pad) calc(var(--pad) * 4); background:#000;
  opacity:0; pointer-events:none; transition:opacity .6s var(--ease);
}
body.gridview #grid{opacity:1; pointer-events:auto}
#grid .rows{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:clamp(10px, 1.4vw, 20px); max-width:1680px; margin:0 auto;
}
#grid figure{position:relative; aspect-ratio:4/5; border-radius:3px; background:#0b0b0b; cursor:pointer; overflow:hidden}
#grid img{width:100%; height:100%; object-fit:cover; opacity:.82; transition:transform .8s var(--ease), opacity .8s var(--ease)}
#grid figure:hover img{transform:scale(1.05); opacity:1}
#grid figcaption{
  position:absolute; left:0; right:0; bottom:0; font-family:var(--serif); font-size:15px;
  background:linear-gradient(to bottom, transparent, rgba(0,0,0,.82)); padding:26px 14px 12px;
  opacity:0; transform:translateY(6px); transition:opacity .4s var(--ease), transform .4s var(--ease);
}
#grid figure:hover figcaption{opacity:1; transform:none}

/* ---------- lightbox ---------- */
#lit{
  position:fixed; inset:0; z-index:90; display:grid; place-items:center;
  padding:clamp(56px, 8vh, 84px) var(--pad);
  opacity:0; pointer-events:none; transition:opacity .42s var(--ease);
}
body.lit #lit{opacity:1; pointer-events:auto}
#lit .scrim{position:absolute; inset:0}
#lit .plate{
  position:relative; width:min(72vw, 560px, (100vh - 250px) * .8);
  transition:transform .62s var(--ease), opacity .42s ease; transform-origin:50% 0;
}
#lit .shot{
  position:relative; width:100%; aspect-ratio:4/5; border-radius:2px; background:#0b0b0b;
  box-shadow:0 30px 90px rgba(0,0,0,.75);
}
#lit .shot img{width:100%; height:100%; object-fit:cover; border-radius:2px}
#lit .close{
  position:absolute; top:12px; right:14px; font-size:12.5px; min-width:44px; min-height:44px; padding:10px 14px;
  border:1px solid rgba(244,242,239,.78); border-radius:6px; background:rgba(0,0,0,.35); color:#f4f2ef;
  transition:border-color .3s, background .3s;
}
#lit .close:hover{border-color:#fff; background:rgba(0,0,0,.55)}
#lit .meta{
  display:grid; grid-template-columns:minmax(0, .78fr) minmax(0, 1.22fr);
  gap:clamp(18px, 2.4vw, 32px); padding-top:16px;
}
#litTitle{font-family:var(--serif); font-weight:400; font-size:clamp(20px, 1.9vw, 28px); line-height:1.08; letter-spacing:-.01em; margin-bottom:6px}
#litWhere{font-size:13px; color:rgba(244,242,239,.62)}
#litNote{font-size:13.5px; line-height:1.55; color:rgba(244,242,239,.92)}

/* ---------- menu ---------- */
#menu{
  position:fixed; inset:0; z-index:80; background:#050505; display:grid; place-items:center;
  clip-path:inset(0 0 100% 0); transition:clip-path .85s var(--ease); pointer-events:none;
}
body.menuopen #menu{clip-path:inset(0); pointer-events:auto}
#menu nav{display:flex; flex-direction:column; gap:clamp(4px, 1vw, 10px); text-align:center}
#menu nav a{
  font-family:var(--serif); font-size:clamp(34px, 7.6vw, 78px); line-height:1.08; color:#f4f2ef;
  text-decoration:none; opacity:.55; transition:opacity .4s var(--ease), letter-spacing .4s var(--ease);
}
#menu nav a:hover{opacity:1; letter-spacing:.012em}
#menu .addr{
  position:absolute; left:calc(var(--pad) + var(--safe-left)); right:calc(var(--pad) + var(--safe-right));
  bottom:calc(var(--pad) + var(--safe-bottom)); font-size:12.5px; color:var(--dim); line-height:1.7;
}

/* ---------- intro + splash ---------- */
#intro{position:fixed; inset:0; z-index:200; background:#000; display:grid; place-items:center; overflow:hidden}
#film{width:100%; height:100%; object-fit:cover}
#intro .veil{position:absolute; inset:0; background:#000; opacity:0; transition:opacity 1.15s ease; pointer-events:none}
#intro.closing .veil{opacity:1}
#intro.gone{opacity:0; pointer-events:none; transition:opacity .5s linear}
#intro .fallback{position:absolute; inset:0; background:radial-gradient(circle at 50% 46%, #14263a 0%, #060a10 42%, #000 72%); opacity:0; pointer-events:none}
#intro.novideo .fallback{opacity:1}
.skip{
  position:absolute; right:calc(var(--pad) + var(--safe-right)); bottom:calc(var(--pad) + var(--safe-bottom));
  font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(244,242,239,.6);
  min-height:44px; padding:10px 18px; border:1px solid rgba(244,242,239,.25); border-radius:999px;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:color .3s, border-color .3s, opacity .3s;
}
.skip:hover{color:#fff; border-color:rgba(255,255,255,.7)}
#intro.closing .skip{opacity:0; pointer-events:none}

#splash{
  position:fixed; inset:0; z-index:250; background:#000; display:grid; place-items:center; align-content:center; gap:26px;
  transition:opacity .6s ease;
}
#splash.out{opacity:0; pointer-events:none}
#splash .mark{font-family:var(--serif); font-size:clamp(28px, 4.4vw, 52px); letter-spacing:.005em; color:#f4f2ef; opacity:0; animation:riseIn 1.25s ease .15s forwards}
#splash .bar{width:clamp(120px, 17vw, 210px); height:1px; background:rgba(244,242,239,.16)}
#splash .bar s{display:block; width:100%; height:100%; background:#f4f2ef; transform:scaleX(0); transform-origin:left center; transition:transform .55s ease}
#splash .tag{font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:rgba(244,242,239,.38); opacity:0; animation:riseIn .9s ease .7s forwards}
@keyframes riseIn{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}

/* ---------- cursor ---------- */
#dot{
  position:fixed; top:0; left:0; z-index:300; width:19px; height:19px; margin:-9.5px; border-radius:50%;
  background:rgba(214,212,209,.9); mix-blend-mode:difference; border:1px solid transparent; pointer-events:none;
  transition:width .35s ease, height .35s ease, margin .35s ease, background .35s ease, border-color .35s ease;
}
#dot.wide{width:52px; height:52px; margin:-26px; background:rgba(244,242,239,.14); border-color:rgba(244,242,239,.75)}
@media (hover:none), (pointer:coarse){ #dot{display:none} }

/* ---------- responsive ---------- */
@media (max-width:900px){
  .bio{max-width:min(420px, calc(100vw - var(--pad) * 2 - var(--safe-left) - var(--safe-right)))}
  .bio p{font-size:12px}
  .colophon{font-size:11px}
  #lit .meta{grid-template-columns:1fr; gap:10px; padding-top:14px}
  #lit .plate{width:min(92vw, (100dvh - 250px) * .8)}
  #grid .rows{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr))}
  #grid{padding-top:calc(var(--pad) * 2.8 + var(--safe-top))}
}
@media (max-width:768px){
  .colophon{display:none}
  .bio{max-width:calc(100vw - var(--pad) * 2 - var(--safe-left) - var(--safe-right))}
  #headline{font-size:clamp(22px, 6.4vw, 34px)}
  #menu nav a{font-size:clamp(28px, 9vw, 54px)}
  #menu .addr{font-size:11.5px}
}
@media (max-width:640px){
  :root{--hw:min(84vw, 360px); --pad:clamp(12px, 4vw, 18px)}
  #avatar{width:42px; height:42px}
  .bio b{font-size:17px}
  .bio p{font-size:11.5px; line-height:1.55}
  .cue{display:none}
  #lit{display:block; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(52px + var(--safe-top)) calc(var(--pad) + var(--safe-right)) calc(var(--pad) + var(--safe-bottom)) calc(var(--pad) + var(--safe-left))}
  #lit .plate{width:100%; max-width:560px; margin:0 auto}
  #litTitle{font-size:clamp(20px, 5.6vw, 26px)}
  #litNote{font-size:12.5px; line-height:1.58}
  #lit .close{top:8px; right:8px}
  #grid .rows{grid-template-columns:1fr 1fr; gap:8px}
  #grid figcaption{opacity:1; transform:none; font-size:13px}
  #grid{padding:calc(var(--pad) * 2.8 + var(--safe-top)) calc(var(--pad) + var(--safe-right)) calc(var(--pad) * 4 + var(--safe-bottom)) calc(var(--pad) + var(--safe-left))}
}
@media (max-width:380px){
  :root{--hw:min(88vw, 320px)}
  .bio .who{gap:10px; margin-bottom:10px}
  .bio p{display:none}
  #grid .rows{grid-template-columns:1fr}
  #menu nav{gap:2px}
  #menu nav a{font-size:clamp(24px, 10vw, 40px)}
}
@media (max-height:520px) and (orientation:landscape){
  .bio, .colophon, .cue{display:none}
  #headline{font-size:clamp(18px, 4.8vh, 28px)}
  #lit{padding-top:calc(36px + var(--safe-top))}
  #lit .meta{padding-top:10px}
  #lit .plate{width:min(40vw, (100dvh - 80px) * .8)}
  header{padding-top:calc(8px + var(--safe-top))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.14s !important}
}
</style>

</head>

var rows = $('rows'), plate = $('plate'), litImg = $('litImg');

}

frame();
(function loop(){ frame(); requestAnimationFrame(loop); })();

window.addEventListener('scroll', function(){
  var max = Math.round(window.innerHeight * SCROLL);
  if (window.scrollY > max) window.scrollTo(0, max);
}, {passive:true});

/* ------------------------------------------------------------------ drag */
var coarse = window.matchMedia('(pointer:coarse)').matches;
var drag = null;
stage.addEventListener('pointerdown', function(e){
  if (litOpen || (e.pointerType === 'mouse' && e.button !== 0)) return;
  var card = e.target.closest ? e.target.closest('.card') : null;
  drag = {id:e.pointerId, x0:e.clientX, y0:e.clientY, lx:e.clientX, ly:e.clientY, card:card, moved:0,
          touch:e.pointerType === 'touch', captured:false, cancelled:false};
  if (!drag.touch) { capture(e); }
});
function capture(e){
  drag.captured = true; dragging = true; velX = velY = 0;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
}
stage.addEventListener('pointermove', function(e){
  if (!drag || e.pointerId !== drag.id || drag.cancelled) return;
  var tx = e.clientX - drag.x0, ty = e.clientY - drag.y0;
  drag.moved = Math.max(drag.moved, Math.hypot(tx, ty));
  if (drag.touch && !drag.captured) {
    if (drag.moved < 10) return;
    if (Math.abs(ty) > Math.abs(tx) * 1.15) { drag.cancelled = true; return; }
    capture(e); drag.lx = e.clientX; drag.ly = e.clientY;
  }
  var dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
  drag.lx = e.clientX; drag.ly = e.clientY;
  velX = dx * TURN; velY = -dy * TURN;
  dragX += velX; dragY += velY;
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  var d = drag; drag = null; dragging = false;
  try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
  if (e.type === 'pointercancel' || d.cancelled) return;
  if (d.moved <= (coarse ? 14 : 6) && d.card) { velX = velY = 0; openShot(+d.card.dataset.idx, d.card); }
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* ------------------------------------------------------------------ lightbox */
var openToken = 0, sourceEl = null, closeTimer = 0;
function flipFrom(el){
  var a = el.getBoundingClientRect(), b = plate.getBoundingClientRect();
  var s = Math.max(.04, a.width / b.width);
  var dx = (a.left + a.width / 2) - (b.left + b.width / 2);
  var dy = (a.top + a.height / 2) - b.top - s * b.width * 1.25 / 2;   /* plate scales from its top centre */
  return 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';
}
function openShot(idx, el){
  var s = SHOTS[idx], token = ++openToken;
  clearTimeout(closeTimer);
  sourceEl = el;
  litImg.src = cards[idx].src || (BASE + s.id + '_min.webp'); litImg.alt = s.title;
  var full = new Image();
  full.onload = function(){ if (token === openToken && litOpen) litImg.src = full.src; };
  full.src = BASE + s.id + '.jpg';
  $('litTitle').textContent = s.title; $('litWhere').textContent = s.place; $('litNote').textContent = s.note;
  focused = el.classList.contains('card') ? idx : -1;
  litOpen = true; body.classList.add('lit'); $('lit').setAttribute('aria-hidden', 'false');
  root.style.overflow = 'hidden';
  $('lit').scrollTop = 0;
  plate.style.transition = 'none'; plate.style.transform = ''; plate.style.opacity = '';
  plate.style.transform = flipFrom(el); plate.style.opacity = '0';
  void plate.offsetWidth;
  plate.style.transition = ''; plate.style.transform = ''; plate.style.opacity = '';
}
function closeShot(){
  if (!litOpen) return;
  openToken++; litOpen = false; focused = -1;
  body.classList.remove('lit'); $('lit').setAttribute('aria-hidden', 'true');
  root.style.overflow = '';
  if (sourceEl && document.body.contains(sourceEl)) { plate.style.transform = flipFrom(sourceEl); plate.style.opacity = '0'; }
  closeTimer = setTimeout(function(){
    plate.style.transition = 'none'; plate.style.transform = ''; plate.style.opacity = '';
    void plate.offsetWidth; plate.style.transition = '';
  }, 640);
}
$('lit').addEventListener('click', function(e){ if (e.target.closest('[data-close]')) closeShot(); });
rows.addEventListener('click', function(e){
  var f = e.target.closest('figure'); if (f) openShot(+f.dataset.idx, f);
});

/* ------------------------------------------------------------------ grid + menu */
function setGrid(on){ body.classList.toggle('gridview', on); }
$('gridBtn').addEventListener('click', function(){ setGrid(!body.classList.contains('gridview')); });
var menuBtn = $('menuBtn');
function setMenu(on){
  body.classList.toggle('menuopen', on);
  menuBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
  menuBtn.setAttribute('aria-label', on ? 'Close menu' : 'Open menu');
  $('menu').setAttribute('aria-hidden', on ? 'false' : 'true');
}
menuBtn.addEventListener('click', function(){ setMenu(!body.classList.contains('menuopen')); });
$('menu').addEventListener('click', function(e){
  var a = e.target.closest('a'); if (!a) return;
  e.preventDefault();
  var col = COLLECTIONS.filter(function(c){ return c.key === a.dataset.col; })[0];
  if (col) { setGrid(false); switchTo(col); } else setGrid(a.hasAttribute('data-grid'));
  setMenu(false);
});
function switchTo(col){
  if (col === COL) return;
  if (litOpen) closeShot();
  body.classList.add('switching');
  setTimeout(function(){
    window.scrollTo(0, 0);
    dragX = dragY = velX = velY = 0; focused = -1;
    build(col); layout(true); loadShots(false);
    requestAnimationFrame(function(){ body.classList.remove('switching'); });
  }, 520);
}
document.querySelector('.wordmark').addEventListener('click', function(e){ e.preventDefault(); setMenu(false); setGrid(false); });
window.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (litOpen) closeShot();
  else if (body.classList.contains('menuopen')) setMenu(false);
  else if (body.classList.contains('gridview')) setGrid(false);
});

/* ------------------------------------------------------------------ cursor */
(function(){
  if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  var dot = $('dot'), tx = -100, ty = -100, x = -100, y = -100;
  window.addEventListener('pointermove', function(e){
    tx = e.clientX; ty = e.clientY;
    var t = e.target.closest ? e.target.closest('.card, a, button, #grid figure') : null;
    dot.classList.toggle('wide', !!t);
  }, {passive:true});
  (function follow(){
    x += (tx - x) * .2; y += (ty - y) * .2;
    dot.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    requestAnimationFrame(follow);
  })();
})();
})();
</script>
