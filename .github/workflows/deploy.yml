name: Deploy to dev server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE: onepaperhoon.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload dist to the server (atomic swap)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@${HOST}"
          # /srv/sites/<site>.new 에 풀고 한 번에 교체한다. Caddy 는 같은 경로를 계속 서빙하므로 끊김 없음.
          tar -C dist -czf - . | $SSH "set -e; S=/srv/sites/$SITE; rm -rf \$S.new \$S.old; mkdir -p \$S.new; tar xzf - -C \$S.new; [ -d \$S ] && mv \$S \$S.old || true; mv \$S.new \$S; rm -rf \$S.old"

      - name: Health check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --resolve ${SITE}:443:${HOST} https://${SITE}/ --max-time 20 || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "헬스체크 실패(200 아님)"; exit 1
